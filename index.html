<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GK_TW — Portfolio</title>
  <meta name="description" content="Portfolio Minecraft 3D Animator — GK_TW">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="cursor-dot" id="cursor-dot"></div>
  <div class="cursor-ring" id="cursor-ring"></div>

  <!-- HORIZONTAL SCROLL CONTAINER -->
  <div class="h-scroll" id="hscroll">

    <!-- PANEL 1: HERO -->
    <section class="panel panel-hero" id="panel-hero">
      <nav class="nav">
        <span class="nav-logo">&lt;<span class="brand-name">GK_TW</span>/&gt;</span>
        <ul class="nav-links">
          <li><a href="#" data-panel="1">Karya</a></li>
          <li><a href="#" data-panel="3">Tentang</a></li>
          <li><a href="#" data-panel="4">Komisi</a></li>
        </ul>
      </nav>

      <div class="hero-content">
        <div class="hero-left">
          <div class="status-badge" id="hero-badge">
            <span class="status-dot"></span>
            <span id="badge-text">Commission Closed</span>
          </div>
          <p class="hero-sub">Minecraft 3D Animator</p>
          <h1 class="hero-title" id="hero-title">Halo,<br><span class="gradient-text">GK_TW</span></h1>
          <p class="hero-desc" id="hero-desc">Loading...</p>
          <div class="hero-btns">
            <button class="btn-main" data-scroll-to="1">Lihat Karya →</button>
            <button class="btn-ghost" data-scroll-to="4">Info Komisi</button>
          </div>
        </div>
        <div class="hero-right">
          <div class="hero-img-wrap" id="hero-img-wrap">
            <div class="hero-img-glow"></div>
            <img id="hero-img" src="" alt="Featured Work">
            <span class="img-badge">✦ Latest Work</span>
          </div>
        </div>
      </div>

      <div class="scroll-arrow">
        <span>SCROLL</span>
        <div class="arrow-line"></div>
        <span>→</span>
      </div>
    </section>

    <!-- PANELS 2+: WORKS (JS generated) -->
    <div id="work-panels"></div>

    <!-- PANEL: ABOUT -->
    <section class="panel panel-about" id="panel-about">
      <div class="about-inner">
        <div class="about-left">
          <p class="panel-label">Tentang</p>
          <h2 class="panel-title">Who am I?</h2>
          <p class="about-bio" id="about-bio">Loading...</p>
          <div class="skills-wrap" id="skills-wrap"></div>
        </div>
        <div class="about-right">
          <div class="about-img-stack" id="about-img-stack"></div>
        </div>
      </div>
    </section>

    <!-- PANEL: COMMISSION -->
    <section class="panel panel-commission" id="panel-commission">
      <div class="comm-inner">
        <p class="panel-label">Komisi</p>
        <h2 class="panel-title">Mau<br>Kolaborasi?</h2>
        <div class="comm-badge" id="comm-badge">
          <span class="status-dot"></span>
          <span id="comm-status-text">Komisi Ditutup</span>
        </div>
        <p class="comm-desc" id="comm-message">Loading...</p>
        <div class="social-row" id="social-row"></div>
        <p class="footer-note">© <span id="footer-year"></span> GK_TW · All rights reserved</p>
      </div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
